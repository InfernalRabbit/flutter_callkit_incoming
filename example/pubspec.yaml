name: flutter_callkit_incoming_example
description: Demonstrates how to use the flutter_callkit_incoming plugin.

publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The web plugin registrant imports flutter_web_plugins; apps that depend on
  # flutter_local_notifications (or any web plugin) need this SDK dependency.
  flutter_web_plugins:
    sdk: flutter

  flutter_callkit_incoming:
    path: ../

  # Used by the example notification delegate in lib/notifications/. It is an
  # application-level dependency; the plugin itself does not depend on it.
  flutter_local_notifications: ^23.0.3

  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.0
  http: ^1.5.0
  uuid: ^4.5.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/test.png
